[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
admin_passwd = change-this-master-password
db_host = 192.168.1.200
db_port = 5432
db_user = odoouser
db_password = odoopass
db_name = db
; ---------------------------------------------------------------------------------------
; When using Odoo20 with a reverse proxy
; (will also need correct "location /" settings and headers within your reverse proxy setup)
; proxy_mode = True
; ---------------------------------------------------------------------------------------
; Odoo20 does NOT install demo data by default (same as Odoo 19; changed from Odoo 17/18)
; To install Odoo20 WITH demo data, uncomment the line below before first start-up
; with_demo = True
; ---------------------------------------------------------------------------------------
; Once set up, hide the database manager (recommended if exposed to the internet)
; list_db = False
; ---------------------------------------------------------------------------------------
; csv_internal_sep = ,
; db_maxconn = 64
; db_sslmode = prefer
; db_system = postgres
; db_template = template0
; dbfilter = .*
; email_from = False
; gevent_port = 8072
; gevent_workers = 1
; limit_memory_hard = 2684354560
; limit_memory_soft = 2147483648
; limit_request = 65536
; limit_time_cpu = 60
; limit_time_real = 120
; log_db = False
; log_handler = :INFO
; log_level = info
; logfile =
; max_cron_threads = 2
; smtp_password = False
; smtp_port = 25
; smtp_server = localhost
; smtp_ssl = False
; smtp_user = False
; workers = 0
; http_enable = True
; http_port = 8069
